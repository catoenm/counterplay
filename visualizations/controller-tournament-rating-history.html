<style>
  #controller-tournament-rating-history { position:relative; }
  #controller-tournament-rating-history .ct-chart { display:block; width:100%; margin-block:12px; }
  #controller-tournament-rating-history .ct-chart text { fill:var(--foreground); font-size:12px; }
  #controller-tournament-rating-history .ct-legend-button { display:inline-flex; align-items:center; gap:5px; padding:4px 0; border:0; background:transparent; color:var(--foreground); font:inherit; border-radius:0; text-align:left; max-width:100%; }
  #controller-tournament-rating-history .ct-legend-button[aria-pressed="false"] { opacity:.45; }
  #controller-tournament-rating-history .ct-swatch { width:16px; height:4px; flex-shrink:0; }
  #controller-tournament-rating-history #ct-tooltip { position:absolute; pointer-events:none; background:var(--popover); color:var(--popover-foreground); width:320px; max-width:calc(100% - 8px); }
  #controller-tournament-rating-history [data-chart-hover-guide], #controller-tournament-rating-history [data-chart-hover-marker] { pointer-events:none; }
  @media (pointer:coarse) { #controller-tournament-rating-history .ct-legend-button { min-height:44px; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const root=document.getElementById('controller-tournament-rating-history');
  const data=JSON.parse(root.querySelector('#ct-data').textContent),get=id=>root.querySelector('#ct-'+id);
  const ns='http://www.w3.org/2000/svg';
  const identities=data.identities;
  const color=id=>`var(--viz-series-${identities.indexOf(id)%6+1})`;
  const dash=id=>data.controllers[id].origin==='scripted'?'6 3':data.controllers[id].authoring_version==='original_retained'&&id!=='controller-python-1'?'2 3':null;
  let hidden=[],pinned=false;
  function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;}
  function restore(saved){if(saved?.privateContent?.revision===data.revision)hidden=(saved.privateContent.hidden||[]).filter(id=>identities.includes(id));}
  function save(){window.openai?.setWidgetState?.({modelContent:{visual:'controller-tournament-elo',run:data.run,visible_controllers:identities.filter(id=>!hidden.includes(id)),rating_identity:'frozen authoring versions'},privateContent:{revision:data.revision,hidden}})?.catch(()=>{});}
  function clear(){get('tooltip').hidden=true;root.querySelectorAll('[data-chart-hover-guide],[data-chart-hover-marker]').forEach(n=>n.remove());}
  function interpolate(points,game){const i=d3.bisector(p=>p.game).left(points,game);if(i===0)return points[0].rating;const a=points[i-1],b=points[Math.min(i,points.length-1)];return a.game===b.game?a.rating:a.rating+(b.rating-a.rating)*(game-a.game)/(b.game-a.game);}
  function draw(){
    clear();pinned=false;get('legend').replaceChildren();
    for(const id of identities){
      const controller=data.controllers[id],button=el('button');button.type='button';button.className='ct-legend-button cursor-interaction';
      button.setAttribute('aria-pressed',String(!hidden.includes(id)));button.setAttribute('aria-label','Show '+controller.label);button.dataset.identity=id;
      button.setAttribute('data-tooltip',`${controller.authoring_model||'Scripted reference'} · ${id} · ${controller.played} games · final Elo ${controller.rating.toFixed(2)} · IR ${controller.ir_sha256}`);
      const swatch=document.createElementNS(ns,'svg');swatch.setAttribute('viewBox','0 0 16 4');swatch.setAttribute('class','ct-swatch');swatch.setAttribute('aria-hidden','true');
      const line=document.createElementNS(ns,'line');for(const [k,v] of Object.entries({x1:0,x2:16,y1:2,y2:2,stroke:color(id),'stroke-width':2}))line.setAttribute(k,v);if(dash(id))line.setAttribute('stroke-dasharray',dash(id));swatch.append(line);
      button.append(swatch,el('span',`${controller.label} · ${Math.round(controller.rating)}`));
      button.addEventListener('click',()=>{hidden=hidden.includes(id)?hidden.filter(x=>x!==id):[...hidden,id];draw();save();});get('legend').append(button);
    }
    const node=get('chart'),width=root.clientWidth,height=310,left=64,right=14,top=12,bottom=50;
    const svg=d3.select(node);svg.selectAll('*').remove();svg.attr('viewBox',`0 0 ${width} ${height}`).attr('height',height);
    const extent=d3.extent(Object.values(data.series).flat().map(p=>p.rating)),pad=Math.max(12,(extent[1]-extent[0])*.1);
    const x=d3.scaleLinear().domain([0,data.games]).range([left+6,width-right-6]);
    const y=d3.scaleLinear().domain([extent[0]-pad,extent[1]+pad]).range([height-bottom-6,top+6]);
    const frame={left,right:width-right,top,bottom:height-bottom};
    svg.append('rect').attr('data-chart-frame','').attr('x',left).attr('y',top).attr('width',frame.right-left).attr('height',frame.bottom-top).attr('fill','none').attr('stroke','var(--border)').attr('stroke-width',1);
    for(const value of y.ticks(5)){
      svg.append('line').attr('x1',left).attr('x2',frame.right).attr('y1',y(value)).attr('y2',y(value)).attr('stroke','var(--border)').attr('stroke-width',.6);
      svg.append('text').attr('x',left-8).attr('y',y(value)+4).attr('text-anchor','end').text(Math.round(value));
    }
    svg.append('line').attr('x1',left).attr('x2',frame.right).attr('y1',y(data.initial)).attr('y2',y(data.initial)).attr('stroke','var(--muted-foreground)').attr('stroke-width',1).attr('stroke-dasharray','2 4');
    const ticks=[0,...data.seed_blocks.map(s=>s.game)].filter((v,i,all)=>width>360||i%2===0||i===all.length-1);
    for(const value of ticks)svg.append('text').attr('x',x(value)).attr('y',height-bottom+20).attr('text-anchor','middle').attr('data-x-tick',value).text(value);
    svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(left+frame.right)/2).attr('y',height-7).attr('text-anchor','middle').text('Recorded games (count)');
    svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform',`translate(17 ${(top+frame.bottom)/2}) rotate(-90)`).attr('text-anchor','middle').text('Elo');
    const visible=identities.filter(id=>!hidden.includes(id));
    for(const id of visible){
      const points=data.series[id];
      svg.append('path').datum(points).attr('data-series',id).attr('fill','none').attr('stroke',color(id)).attr('stroke-width',2).attr('stroke-dasharray',dash(id)).attr('d',d3.line().x(p=>x(p.game)).y(p=>y(p.rating)));
      svg.append('circle').attr('data-series',id).attr('data-final',id).attr('cx',x(data.games)).attr('cy',y(points.at(-1).rating)).attr('r',4).attr('fill',color(id));
    }
    const overlay=svg.append('rect').attr('data-chart-hit','').attr('data-chart-hover-overlay','cross-series').attr('x',left).attr('y',top).attr('width',frame.right-left).attr('height',frame.bottom-top).attr('fill','transparent');
    function hover(event){
      clear();const [raw]=d3.pointer(event,node),px=Math.max(left,Math.min(frame.right,raw)),game=Math.max(0,Math.min(data.games,x.invert(px)));
      if(!visible.length)return;
      svg.append('line').attr('data-chart-hover-guide','').attr('x1',px).attr('x2',px).attr('y1',top).attr('y2',frame.bottom).attr('stroke','var(--muted-foreground)').attr('stroke-width',1);
      const tooltip=get('tooltip');tooltip.replaceChildren(el('div',`Game ${game.toFixed(2)} · interpolated Elo`));
      for(const id of visible){const rating=interpolate(data.series[id],game);svg.append('circle').attr('data-chart-hover-marker',id).attr('cx',px).attr('cy',y(rating)).attr('r',4).attr('fill',color(id));tooltip.append(el('div',`${data.controllers[id].label}: ${rating.toFixed(1)}`));}
      tooltip.hidden=false;const bounds=root.getBoundingClientRect();
      tooltip.style.left=Math.max(4,Math.min(event.clientX-bounds.left+12,root.clientWidth-tooltip.offsetWidth-4))+'px';
      tooltip.style.top=Math.max(4,event.clientY-bounds.top-tooltip.offsetHeight-10)+'px';
    }
    overlay.on('pointermove',event=>{if(!pinned)hover(event);}).on('pointerleave',()=>{if(!pinned)clear();}).on('click',event=>{pinned=!pinned;if(pinned)hover(event);else clear();});
    const labels=[...node.querySelectorAll('text')];
    for(const label of labels){const box=label.getBoundingClientRect(),area=node.getBoundingClientRect();if((box.left<area.left||box.right>area.right||box.top<area.top||box.bottom>area.bottom)&&!label.classList.contains('axis-title'))label.remove();}
  }
  get('scope').textContent=`${data.games} replay-verified games · seven retained controller versions · start ${data.initial} · K = ${data.k_factor}`;
  get('scope').setAttribute('data-tooltip',data.order);
  get('note').textContent='Legend values: final Elo · each controller played 72 games';
  restore(window.openai?.widgetState);draw();new ResizeObserver(draw).observe(root);
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);draw();}});
})();
</script>
