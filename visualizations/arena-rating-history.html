<style>
#arena-rating-history { position:relative; }
#arena-rating-history .er-chart { display:block; width:100%; }
#arena-rating-history .er-chart text { fill:var(--foreground); font-size:12px; }
#arena-rating-history .er-chart [data-chart-hover-guide], #arena-rating-history .er-chart [data-chart-hover-marker] { pointer-events:none; }
#arena-rating-history .er-game { margin-block:16px; }
#arena-rating-history .er-title { margin-bottom:2px; }
#arena-rating-history .er-counts { margin-bottom:2px; }
#arena-rating-history .er-values { overflow-wrap:anywhere; }
#arena-rating-history .er-legend-button { display:inline-flex; align-items:center; gap:5px; padding:4px 0; border:0; background:transparent; color:var(--foreground); font:inherit; border-radius:0; }
#arena-rating-history .er-legend-button[aria-pressed="false"] { opacity:.45; }
#arena-rating-history .er-swatch { display:inline-block; width:14px; height:3px; }
#arena-rating-history #er-tooltip { position:absolute; pointer-events:none; background:var(--popover); color:var(--popover-foreground); max-width:240px; }
@media (pointer:coarse) { #arena-rating-history .er-legend-button { min-height:44px; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const root=document.getElementById('arena-rating-history');
  const data=JSON.parse(root.querySelector('#er-data').textContent);
  const get=id=>root.querySelector('#er-'+id);
  get('run').textContent=`${data.rating_pool?.policy_arithmetic?.activation_arithmetic==='float32'?'FP32 policy · ':''}${data.run} · ${data.completed_matches_verified} verified evaluation / league matches`;
  const names={market:'Market',maze:'Maze race',chess:'Chess endgames'};
  const display=id=>id==='base'?'Base':id==='heuristic'?'Heuristic':/^cycle\d+$/.test(id)?'Checkpoint '+id.slice(5):id;
  const rank=id=>id==='base'?0:id==='heuristic'?10000:Number(id.match(/\d+/)?.[0]||9999);
  const identities=[...new Set(Object.values(data.games).flatMap(g=>Object.keys(g.series)))].sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b));
  const color=id=>`var(--viz-series-${id==='heuristic'?6:1+(rank(id)%5)})`;
  const dash=id=>id==='heuristic'?'5 3':rank(id)>=5?'2 3':null;
  let selected={iteration:data.observed_iterations.at(-1),hidden:[],revision:0};
  let pinned=false;
  function restore(saved){
    const state=saved?.privateContent;
    if(!state||state.run!==data.run||(state.revision||0)<selected.revision)return;
    if(data.observed_iterations.includes(state.iteration))selected.iteration=state.iteration;
    selected.hidden=(state.hidden||[]).filter(id=>identities.includes(id));
    selected.revision=state.revision||0;
  }
  function save(){
    selected.revision=Math.max(Date.now(),selected.revision+1);
    window.openai?.setWidgetState?.({modelContent:{run:data.run,iteration:selected.iteration,
      visible_checkpoints:identities.filter(id=>!selected.hidden.includes(id)),rating:'per-environment Elo'},
      privateContent:{...selected,run:data.run}})?.catch(()=>{});
  }
  function element(tag,attrs={},text){
    const node=document.createElement(tag);
    for(const [key,value] of Object.entries(attrs))node.setAttribute(key,value);
    if(text!==undefined)node.textContent=text;
    return node;
  }
  function currentValues(game){
    return identities.flatMap(id=>{
      if(selected.hidden.includes(id))return [];
      const point=game.series[id]?.filter(p=>p.iteration<=selected.iteration).at(-1);
      return point?[{id,...point}]:[];
    });
  }
  function clearHover(){
    get('tooltip').hidden=true;
    root.querySelectorAll('[data-chart-hover-guide],[data-chart-hover-marker]').forEach(node=>node.remove());
  }
  function interpolate(points,iteration){
    if(iteration<points[0].iteration||iteration>points.at(-1).iteration)return null;
    const index=d3.bisector(p=>p.iteration).left(points,iteration);
    if(index===0)return points[0].rating;
    const a=points[index-1],b=points[Math.min(index,points.length-1)];
    if(a.iteration===b.iteration)return a.rating;
    return a.rating+(b.rating-a.rating)*(iteration-a.iteration)/(b.iteration-a.iteration);
  }
  function describeReasons(counts){
    return Object.entries(counts).map(([reason,count])=>{
      const short=reason==='material_adjudication_at_cap'?'material caps':
        reason==='distance_adjudication_at_cap'?'distance caps':
        reason==='goal'?'goal finishes':reason==='checkmate'?'checkmates':
        reason==='settlement'?'settlements':reason.replaceAll('_',' ');
      return `${count} ${short}`;
    }).join(' · ');
  }
  function draw(){
    clearHover();pinned=false;
    get('charts').replaceChildren();get('legend').replaceChildren();
    if(!data.observed_iterations.length){
      get('status').textContent='Awaiting completed matches between distinct policies';
      get('stage').disabled=true;return;
    }
    for(const id of identities){
      const button=element('button',{type:'button',class:'er-legend-button cursor-interaction',
        'aria-pressed':!selected.hidden.includes(id),'aria-label':`Show ${display(id)}`});
      button.append(element('span',{class:'er-swatch',style:`background:${color(id)}`,'aria-hidden':'true'}),
        document.createTextNode(display(id)));
      button.addEventListener('click',()=>{
        selected.hidden=selected.hidden.includes(id)?selected.hidden.filter(x=>x!==id):[...selected.hidden,id];draw();save();
      });get('legend').append(button);
    }
    get('stage').replaceChildren(...data.observed_iterations.map(value=>element('option',{value},
      (value===0?'0 · Base evaluation':`${value} · After update ${value}`)+(data.stage_coverage?.[value]?.partial?' · partial':''))));
    get('stage').value=selected.iteration;
    const allPoints=Object.values(data.games).flatMap(g=>Object.values(g.series).flat());
    const yExtent=d3.extent([data.initial_rating,...allPoints.map(p=>p.rating)]);
    const yPad=Math.max(12,(yExtent[1]-yExtent[0])*.12),yDomain=[yExtent[0]-yPad,yExtent[1]+yPad];
    const xExtent=d3.extent(data.observed_iterations),single=xExtent[0]===xExtent[1];
    const xDomain=single?[xExtent[0]-.5,xExtent[1]+.5]:xExtent;
    for(const [gameId,game] of Object.entries(data.games)){
      const section=element('section',{class:'er-game','aria-label':`${names[gameId]||gameId} ratings`});
      section.append(element('div',{class:'er-title'},`${names[gameId]||gameId} · ${game.rated_matches} rated matches`));
      section.append(element('div',{class:'er-counts text-small'},describeReasons(game.termination_counts)));
      const svgNode=document.createElementNS('http://www.w3.org/2000/svg','svg');
      svgNode.classList.add('er-chart');svgNode.setAttribute('role','img');
      svgNode.setAttribute('aria-label',`${names[gameId]||gameId} Elo after recorded training iterations. All models start at 1500. ${game.rated_matches} rated matches.`);
      section.append(svgNode);
      const values=element('div',{class:'er-values viz-row text-small tabular-nums'});
      for(const point of currentValues(game))values.append(element('span',{},`${display(point.id)} ${Math.round(point.rating)} (${point.games} games)`));
      section.append(values);get('charts').append(section);
      const width=section.clientWidth,height=214,left=64,right=14,top=12,bottom=48;
      const svg=d3.select(svgNode).attr('viewBox',`0 0 ${width} ${height}`).attr('height',height);
      const x=d3.scaleLinear().domain(xDomain).range([left+6,width-right-6]);
      const y=d3.scaleLinear().domain(yDomain).range([height-bottom-6,top+6]);
      const plot={left,top,right:width-right,bottom:height-bottom};
      svg.append('rect').attr('data-chart-frame','').attr('x',plot.left).attr('y',plot.top)
        .attr('width',plot.right-plot.left).attr('height',plot.bottom-plot.top)
        .attr('fill','none').attr('stroke','var(--border)').attr('stroke-width',1);
      const yTicks=y.ticks(4);
      for(const tick of yTicks){
        if(y(tick)<plot.top||y(tick)>plot.bottom)continue;
        svg.append('line').attr('x1',plot.left).attr('x2',plot.right).attr('y1',y(tick)).attr('y2',y(tick))
          .attr('stroke','var(--border)').attr('stroke-width',.6);
        svg.append('text').attr('x',left-8).attr('y',y(tick)+4).attr('text-anchor','end').text(Math.round(tick));
      }
      svg.append('line').attr('x1',plot.left).attr('x2',plot.right).attr('y1',y(1500)).attr('y2',y(1500))
        .attr('stroke','var(--muted-foreground)').attr('stroke-width',1).attr('stroke-dasharray','2 4');
      const maxTicks=width<=360?4:6,step=Math.max(1,Math.ceil((data.observed_iterations.length-1)/(maxTicks-1)));
      const ticks=data.observed_iterations.filter((_,i)=>i%step===0||i===data.observed_iterations.length-1);
      for(const tick of ticks)svg.append('text').attr('x',x(tick)).attr('y',height-bottom+19).attr('text-anchor','middle').text(tick);
      svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(left+plot.right)/2)
        .attr('y',height-7).attr('text-anchor','middle').text('Training iteration');
      svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform',`translate(17 ${(top+plot.bottom)/2}) rotate(-90)`)
        .attr('text-anchor','middle').text('Elo');
      if(game.stages[selected.iteration])svg.append('line').attr('x1',x(selected.iteration)).attr('x2',x(selected.iteration))
        .attr('y1',plot.top).attr('y2',plot.bottom).attr('stroke','var(--border)').attr('stroke-width',1);
      const visible=identities.filter(id=>game.series[id]&&!selected.hidden.includes(id));
      for(const id of visible){
        const points=game.series[id];
        svg.append('path').datum(points).attr('data-series',id).attr('fill','none').attr('stroke',color(id))
          .attr('stroke-width',2).attr('stroke-dasharray',dash(id))
          .attr('d',d3.line().x(p=>x(p.iteration)).y(p=>y(p.rating)));
        svg.selectAll(`circle.er-${id.replace(/[^a-zA-Z0-9]/g,'')}`).data(points).enter().append('circle')
          .attr('data-series',id).attr('cx',p=>x(p.iteration)).attr('cy',p=>y(p.rating)).attr('r',4).attr('fill',color(id));
      }
      const overlay=svg.append('rect').attr('data-chart-hit','').attr('data-chart-hover-overlay','cross-series')
        .attr('x',plot.left).attr('y',plot.top).attr('width',plot.right-plot.left).attr('height',plot.bottom-plot.top)
        .attr('fill','transparent');
      function hover(event){
        clearHover();
        const [rawX]=d3.pointer(event,svgNode),px=Math.max(plot.left,Math.min(plot.right,rawX));
        const iteration=single?xExtent[0]:Math.max(xExtent[0],Math.min(xExtent[1],x.invert(px)));
        if(single&&Math.abs(px-x(xExtent[0]))>24)return;
        const rows=visible.map(id=>({id,rating:interpolate(game.series[id],iteration)})).filter(p=>p.rating!==null);
        if(!rows.length)return;
        svg.append('line').attr('data-chart-hover-guide','').attr('x1',px).attr('x2',px)
          .attr('y1',plot.top).attr('y2',plot.bottom).attr('stroke','var(--muted-foreground)').attr('stroke-width',1);
        for(const row of rows)svg.append('circle').attr('data-chart-hover-marker',row.id).attr('cx',px)
          .attr('cy',y(row.rating)).attr('r',4).attr('fill',color(row.id));
        const tooltip=get('tooltip');tooltip.replaceChildren();
        tooltip.append(element('div',{},`${names[gameId]} · iteration ${iteration.toFixed(single?0:2)}`));
        for(const row of rows)tooltip.append(element('div',{},`${display(row.id)}: ${row.rating.toFixed(1)}`));
        if(!Number.isInteger(iteration))tooltip.append(element('div',{class:'text-small'},'Interpolated between recorded snapshots'));
        tooltip.hidden=false;
        const bounds=root.getBoundingClientRect();
        tooltip.style.left=Math.max(4,Math.min(event.clientX-bounds.left+12,root.clientWidth-tooltip.offsetWidth-4))+'px';
        tooltip.style.top=Math.max(4,event.clientY-bounds.top-tooltip.offsetHeight-10)+'px';
      }
      overlay.on('pointermove',event=>{if(!pinned)hover(event);})
        .on('pointerleave',()=>{if(!pinned)clearHover();})
        .on('click',event=>{pinned=!pinned;if(pinned)hover(event);else clearHover();});
      // Inspect all visible labels after layout; optional ticks are removed first.
      const textNodes=[...svgNode.querySelectorAll('text')];
      for(const node of textNodes){
        const box=node.getBBox();
        if(box.x<0||box.x+box.width>width||box.y<0||box.y+box.height>height){
          if(!node.classList.contains('axis-title'))node.remove();
        }
      }
    }
    const excluded=Object.values(data.games).reduce((sum,g)=>sum+g.same_policy_matches_excluded,0);
    const latest=data.observed_iterations.at(-1),coverage=data.stage_coverage?.[latest];
    get('status').textContent=`Observed through iteration ${latest}${coverage?.partial?' (partial evaluation)':''} · ${excluded} same-policy matches excluded`;
  }
  restore(window.openai?.widgetState);
  get('stage').addEventListener('change',()=>{selected.iteration=Number(get('stage').value);draw();save();});
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);draw();}});
  new ResizeObserver(draw).observe(root);draw();
})();
</script>
