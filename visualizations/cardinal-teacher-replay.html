      node('desc',{},'Seven by seven shared grid. A is a circle; B is a square. Resource labels show remaining units times point value. H labels each robot home.');
      for(let i=0;i<7;i++){node('text',{x:left+(i+.5)*cell,y:14,'text-anchor':'middle'},i);node('text',{x:10,y:top+(i+.5)*cell+4,'text-anchor':'middle'},i);}
      for(let y=0;y<7;y++)for(let x=0;x<7;x++){
        const site=siteAt(x,y);node('rect',{x:left+x*cell,y:top+y*cell,width:cell,height:cell,fill:site&&site.units?'var(--muted)':'transparent',stroke:'var(--border)','stroke-width':1});
        if(site)node('text',{x:left+(x+.5)*cell,y:top+(y+1)*cell-5,'text-anchor':'middle',opacity:site.units?1:.55},site.units+'×'+site.value);
      }
      state.robots.forEach((r,p)=>{
        node('text',{x:left+(r.home_x+.5)*cell,y:top+(r.home_y+1)*cell-5,'text-anchor':'middle'},'H'+(p?'B':'A'));
      });
      state.robots.forEach((r,p)=>{
        const other=state.robots[1-p],shared=r.x===other.x&&r.y===other.y;
        const occupiedLabel=siteAt(r.x,r.y)||(r.x===r.home_x&&r.y===r.home_y)||(r.x===other.home_x&&r.y===other.home_y);
        const cx=left+(r.x+.5)*cell+(shared?(p?1:-1)*cell*.22:0),cy=top+(r.y+.5)*cell-(occupiedLabel?cell*.16:0),radius=Math.min(12,cell*.22);
        const fill=`color-mix(in srgb,var(--viz-series-${p+1}) 36%,var(--background))`;
        if(p===0)node('circle',{cx,cy,r:radius,fill});else node('rect',{x:cx-radius,y:cy-radius,width:radius*2,height:radius*2,fill});
        node('text',{x:cx,y:cy+4,'text-anchor':'middle'},p?'B':'A');
      });
    }
    function render(){
      get('pa-coverage').textContent=episodes.length?`${data.shown} of ${data.total} matches · all source replays verified · no gradient training`:'Awaiting completed matches';
      get('pa-selection').textContent=data.selection_label||'';
      get('pa-selection').setAttribute('data-tooltip',data.selection||'');
      get('pa-prev').disabled=!episodes.length||step===0;get('pa-next').disabled=!episodes.length||step===episodes[index].states.length-1;
      select.disabled=!episodes.length;slider.disabled=!episodes.length;
      if(!episodes.length){get('pa-step').textContent='';draw();return;}
      const e=episodes[index],state=e.states[step],decisions=step?e.decisions[step-1]:null;
      get('pa-source').textContent=data.mode+' · Scripted reference';
      get('pa-source').setAttribute('data-tooltip','Original record SHA-256: '+e.record_sha256);
      select.value=String(index);slider.max=String(e.states.length-1);slider.value=String(step);
      select.setAttribute('data-tooltip',`${e.players[0]} vs ${e.players[1]} · seed ${e.seed}`);
      get('pa-step').textContent=`Round ${step} / ${e.states.length-1}`;
      for(let p=0;p<2;p++){
        const r=state.robots[p],identity=get('pa-identity-'+p),letter=p?'B':'A';
        identity.replaceChildren();const marker=document.createElement('span');marker.className='pa-marker'+(p?' pa-marker-b':'');identity.appendChild(marker);
        identity.appendChild(document.createTextNode(`${letter} · ${e.players[p]} · ${e.origins[p]} · ${e.digests[p].slice(0,8)}`));
        identity.setAttribute('data-tooltip',`${e.origins[p]==='model'?(e.models?.[p]||e.model)+' · ':''}${e.identities?.[p]||e.players[p]} · Program SHA-256: ${e.digests[p]}`);
        get('pa-values-'+p).textContent=`${r.score} points · Cargo ${r.cargo.length}/3 · Energy ${r.energy}/10`;
        get('pa-action-'+p).textContent=decisions?`${actionText(decisions[p].action)} → ${e.outcomes[step-1][p].replaceAll('_',' ')}`:'Before the first action';
        const fault=get('pa-fault-'+p);fault.className='text-small'+(decisions?.[p].fault?' text-destructive':' text-muted');
        fault.textContent=decisions?`${decisions[p].steps} operations · ${decisions[p].fault?'Fault: '+decisions[p].fault.replaceAll('_',' '):'no interpreter fault'}`:'Memory starts at zero';
      }
      get('pa-result').textContent=step===e.states.length-1?`Final points ${state.robots[0].score}–${state.robots[1].score} · relative returns ${e.returns[0].toFixed(3)} / ${e.returns[1].toFixed(3)} · no gradient training`:`Seed ${e.seed} · ${state.sites.reduce((n,s)=>n+s.units,0)} resource units remain`;
      draw();
    }
    episodes.forEach((e,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent=`${e.players[0]} vs ${e.players[1]} · seed ${e.seed}`;select.appendChild(option);});
    select.addEventListener('change',()=>{index=Number(select.value);step=0;render();save();});
    slider.addEventListener('input',()=>{step=Number(slider.value);render();});slider.addEventListener('change',save);
    get('pa-prev').addEventListener('click',()=>{if(step>0){step--;render();save();}});
    get('pa-next').addEventListener('click',()=>{if(episodes.length&&step<episodes[index].states.length-1){step++;render();save();}});
    window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState;if(saved){restore(saved);render();}});
    restore(window.openai?.widgetState);render();new ResizeObserver(draw).observe(svg.parentElement);
  })();
  </script>
</div>
