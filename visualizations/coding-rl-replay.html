  <script>
  (() => {
    const root=document.getElementById('coding-rl-replay');
    const data=JSON.parse(root.querySelector('#cr-data').textContent),episodes=data.episodes;

    let index=0,step=0;
    const ns='http://www.w3.org/2000/svg';
    const phaseLabel={training:'Training rollout',before:'Before update · held-out evaluation',after:'After update · held-out evaluation'};
    function element(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;}
    function node(tag,attrs={},text){const n=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));if(text!==undefined)n.textContent=text;svg.appendChild(n);return n;}
    function save(){window.openai?.setWidgetState?.({modelContent:{visual:'coding-rl-replay',run:data.run,episode:episodes[index].id,round:step,checkpoint:episodes[index].checkpoint_labels[episodes[index].candidate_seat]},privateContent:{revision:data.revision,index,step}})?.catch(()=>{});}
    function restore(saved){const s=saved?.privateContent;if(s?.revision===data.revision&&Number.isInteger(s.index)&&s.index>=0&&s.index<episodes.length){index=s.index;step=Math.max(0,Math.min(Number.isInteger(s.step)?s.step:0,episodes[index].states.length-1));}}
    function actionText(a){if(a.action==='move')return 'Move '+(a.dx===1?'east':a.dx===-1?'west':a.dy===1?'south':'north');return a.action.charAt(0).toUpperCase()+a.action.slice(1);}
    function draw(){
      svg.replaceChildren();
      const e=episodes[index],state=e.states[step],width=svg.parentElement.clientWidth;
      const left=22,top=22,cell=(width-left-2)/7,height=top+7*cell+2;
      svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('height',height);
      const siteAt=(x,y)=>state.sites.find(s=>s.x===x&&s.y===y);
      node('title',{},`Round ${step}: A has ${state.robots[0].score} points; B has ${state.robots[1].score} points.`);
      node('desc',{},'Seven by seven shared grid. A is a circle; B is a square. Resource labels show remaining units times point value. H labels each robot home.');
      for(let i=0;i<7;i++){node('text',{x:left+(i+.5)*cell,y:14,'text-anchor':'middle'},i);node('text',{x:10,y:top+(i+.5)*cell+4,'text-anchor':'middle'},i);}
      for(let y=0;y<7;y++)for(let x=0;x<7;x++){
        const site=siteAt(x,y);node('rect',{'data-cell':`${x},${y}`,x:left+x*cell,y:top+y*cell,width:cell,height:cell,fill:site&&site.units?'var(--muted)':'transparent',stroke:'var(--border)','stroke-width':1});
        if(site)node('text',{'data-site':`${x},${y}`,x:left+(x+.5)*cell,y:top+(y+1)*cell-5,'text-anchor':'middle',opacity:site.units?1:.55},site.units+'×'+site.value);
      }
      state.robots.forEach((r,p)=>node('text',{x:left+(r.home_x+.5)*cell,y:top+(r.home_y+1)*cell-5,'text-anchor':'middle'},'H'+(p?'B':'A')));
      state.robots.forEach((r,p)=>{
        const other=state.robots[1-p],shared=r.x===other.x&&r.y===other.y;
        const label=siteAt(r.x,r.y)||(r.x===r.home_x&&r.y===r.home_y)||(r.x===other.home_x&&r.y===other.home_y);
        const cx=left+(r.x+.5)*cell+(shared?(p?1:-1)*cell*.22:0),cy=top+(r.y+.5)*cell-(label?cell*.16:0),radius=Math.min(12,cell*.22);
        const fill=`color-mix(in srgb,var(--viz-series-${p+1}) 36%,var(--background))`,attrs={'data-robot':p,'data-x':r.x,'data-y':r.y};

        node('text',{x:cx,y:cy+4,'text-anchor':'middle'},p?'B':'A');
      });
    }
    function render(){
      const e=episodes[index],state=e.states[step],decisions=step?e.decisions[step-1]:null;
      root.dataset.episode=e.id;root.dataset.step=step;

        identity.setAttribute('data-tooltip',`${controller.model||'Scripted reference'} · ${controller.id} · checkpoint ${controller.checkpoint||'none'} · IR SHA-256: ${controller.ir_sha256}`);
        get('values-'+p).textContent=`${r.score} points · Cargo ${r.cargo.length}/3 · Energy ${r.energy}/10`;
        get('action-'+p).textContent=decisions?`${actionText(decisions[p].action)} → ${e.outcomes[step-1][p].replaceAll('_',' ')}`:'Before the first action';
        const fault=get('fault-'+p);fault.className='text-small'+(decisions?.[p].fault?' text-destructive':' text-muted');

      }
      get('result').textContent=step===e.states.length-1?`Final points ${state.robots[0].score}–${state.robots[1].score} · returns ${e.returns[0].toFixed(3)} / ${e.returns[1].toFixed(3)}`:`Seed ${e.seed} · ${state.sites.reduce((n,s)=>n+s.units,0)} resource units remain`;
      get('programs').replaceChildren();
      for(let p=0;p<2;p++){
        const controller=data.controllers[e.identities[p]],heading=element('p',`${p?'B':'A'} · ${controller.label}`);

        if(controller.python_source){const pre=element('pre'),code=element('code',controller.python_source);pre.append(code);get('programs').append(pre);}

      }
      draw();
    }
    get('update').textContent=`Qwen3.8-27B · ${data.optimizer_steps} RLOO update · ${data.training_tokens.toLocaleString()} sampled tokens`;
    get('context').textContent='Frozen practice-feedback context · unchanged before and after';
    get('context').setAttribute('data-tooltip',data.condition+' · prompt SHA-256: '+data.prompt_sha256);
    get('evaluation').textContent=`Held-out mean return ${data.evaluations.base.mean_reward.toFixed(3)} → ${data.evaluations.step1.mean_reward.toFixed(3)} · banked points ${data.evaluations.base.banked_points} → ${data.evaluations.step1.banked_points}`;
    get('sample').textContent=`${data.shown} verified training / evaluation games · 1 evaluation program per checkpoint · 1 held-out map, both seats, 3 opponents${data.same_evaluation_program?' · identical sampled evaluation code':''}`;
    get('sample').setAttribute('data-tooltip',data.selection);
    for(const row of data.training_rows){
      const reason=row.reason==='generation_length'?'token limit':row.reason==='invalid_bounded_python'?'invalid Python':row.reason;
      const line=`Draw ${row.draw}: ${row.tokens} tokens · reward ${row.reward.toFixed(3)} · RLOO advantage ${row.advantage.toFixed(3)} · ${row.valid?row.matches+' real games':reason+'; no game'}`;
      get('authorship').append(element('li',line));
    }
    episodes.forEach((e,i)=>{const option=element('option');option.value=String(i);option.textContent=`${e.phase==='training'?'Train':e.phase==='before'?'Before':'After'} · ${e.players[e.candidate_seat]} vs ${e.players[1-e.candidate_seat]} · seat ${e.candidate_seat?'B':'A'}`;select.append(option);});
    select.addEventListener('change',()=>{index=Number(select.value);step=0;render();save();});
    slider.addEventListener('input',()=>{step=Number(slider.value);render();});slider.addEventListener('change',save);
    get('prev').addEventListener('click',()=>{if(step>0){step--;render();save();}});
    get('next').addEventListener('click',()=>{if(step<episodes[index].states.length-1){step++;render();save();}});
    window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
    restore(window.openai?.widgetState);render();new ResizeObserver(draw).observe(svg.parentElement);
  })();
