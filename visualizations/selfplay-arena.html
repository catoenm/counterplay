<script>
(() => {
  const root=document.getElementById('selfplay-arena');
  const data=JSON.parse(root.querySelector('#sa-data').textContent);
  const get=id=>root.querySelector('#sa-'+id);
  get('run').textContent=`${data.policy_arithmetic?.activation_arithmetic==='float32'?'FP32 policy · ':''}${data.run} · ${data.episodes.length} verified episodes`;
  const gameNames={market:'Market',maze:'Maze race',chess:'Chess endgame'};
  const checkpointNames={base:'Base',cycle1:'After update 1',cycle2:'After update 2',heuristic:'Fixed heuristic'};
  const ns='http://www.w3.org/2000/svg';
  let selected={game:'market',checkpoint:'base',episode:null,step:0,revision:0};
  function element(tag,attrs={},text){
    const item=document.createElement(tag);
    for(const [key,value] of Object.entries(attrs))item.setAttribute(key,value);
    if(text!==undefined)item.textContent=text;
    return item;
  }
  function svgElement(tag,attrs={},text){
    const item=document.createElementNS(ns,tag);
    for(const [key,value] of Object.entries(attrs))item.setAttribute(key,value);
    if(text!==undefined)item.textContent=text;
    return item;
  }
  function svg(width,height,label){
    const item=svgElement('svg',{class:'sa-board',viewBox:`0 0 ${width} ${height}`,height,role:'img','aria-label':label});
    return item;
  }
  function options(node,items,value){
    node.replaceChildren();
    for(const item of items)node.append(element('option',{value:item.value},item.label));
    node.value=value;
    const option=node.selectedOptions[0];
    if(option)node.setAttribute('data-tooltip',option.textContent);
  }
  function restore(saved){
    const s=saved?.privateContent;
    if(!s||s.run!==data.run||(s.revision||0)<selected.revision)return;
    const episode=data.episodes.find(e=>e.id===s.episode);
    if(!episode)return;
    selected={game:episode.environment,checkpoint:episode.checkpoint,episode:episode.id,
              step:Number.isInteger(s.step)?Math.max(0,Math.min(s.step,episode.actions.length)):0,
              revision:s.revision||0};
  }
  function save(){
    selected.revision=Math.max(Date.now(),selected.revision+1);
    window.openai?.setWidgetState?.({modelContent:{environment:selected.game,checkpoint:selected.checkpoint,
      episode:selected.episode,step:selected.step,run:data.run,recorded:true},
      privateContent:{...selected,run:data.run}})?.catch(()=>{});
  }
  function matchLabel(e){
    if(e.phase==='training')return `Self-play · seed ${e.seed}`;
    const opponent=e.policies[1-e.seat];
    const name=opponent==='heuristic'?'heuristic':checkpointNames[opponent]||opponent;
    return `${e.phase==='league'?'League':'Eval'} · vs ${name} · P${e.seat} · ${e.seed}`;
  }
  function sync(){
    const games=[...new Set(data.episodes.map(e=>e.environment))];
    if(!games.includes(selected.game))selected.game=games[0];
    options(get('game'),games.map(value=>({value,label:gameNames[value]||value})),selected.game);
    const checkpoints=[...new Set(data.episodes.filter(e=>e.environment===selected.game).map(e=>e.checkpoint))];
    if(!checkpoints.includes(selected.checkpoint))selected.checkpoint=checkpoints[0];
    options(get('checkpoint'),checkpoints.map(value=>({value,label:checkpointNames[value]||value})),selected.checkpoint);
    const episodes=data.episodes.filter(e=>e.environment===selected.game&&e.checkpoint===selected.checkpoint);
    if(!episodes.some(e=>e.id===selected.episode)){selected.episode=episodes[0]?.id;selected.step=0;}
    options(get('episode'),episodes.map(e=>({value:e.id,label:matchLabel(e)})),selected.episode);
    return episodes.find(e=>e.id===selected.episode);
  }
  function identity(player,label){
    const span=element('span');
    span.append(element('span',{class:'sa-identity',style:`background:var(--viz-series-${player+1})`,'aria-hidden':'true'}));
    span.append(document.createTextNode(label));
    return span;
  }
  function maze(state,episode){
    const pair=element('div',{class:'sa-maze-pair'});
    const available=Math.max(120,(get('stage').clientWidth-12)/2);
    for(const player of [0,1]){
      const section=element('div');
      section.append(element('div',{class:'sa-board-title'},`P${player} · ${state.blocks_remaining[player]} blocks left`));
      const width=available,margin=8,cell=(width-2*margin)/state.size;
      const map=svg(width,width,`Player ${player} maze. Position row ${state.positions[player][0]}, column ${state.positions[player][1]}; goal row ${state.goal[0]}, column ${state.goal[1]}.`);
      const walls=new Set(state.walls[player].map(v=>v.join(',')));
      const terrain=new Set(state.terrain.map(v=>v.join(',')));
      for(let row=0;row<state.size;row++)for(let col=0;col<state.size;col++){
        const key=`${row},${col}`,x=margin+col*cell,y=margin+row*cell;
        const isWall=walls.has(key),isBlock=isWall&&!terrain.has(key);
        map.append(svgElement('rect',{x,y,width:cell,height:cell,
          fill:isWall?'color-mix(in srgb,var(--foreground) 18%,transparent)':'var(--background)',
          stroke:'var(--border)','stroke-width':1}));
        if(isBlock)map.append(svgElement('text',{x:x+cell/2,y:y+cell/2+4,'text-anchor':'middle'},'×'));
      }
      const gx=margin+(state.goal[1]+.5)*cell,gy=margin+(state.goal[0]+.5)*cell,r=cell*.28;
      map.append(svgElement('path',{d:`M${gx},${gy-r} L${gx+r},${gy} L${gx},${gy+r} L${gx-r},${gy} Z`,
        fill:'none',stroke:'var(--foreground)','stroke-width':1.5}));
      const position=state.positions[player],px=margin+(position[1]+.5)*cell,py=margin+(position[0]+.5)*cell;
      if(selected.step){
        const previous=episode.states[selected.step-1].positions[player];
        map.append(svgElement('line',{x1:margin+(previous[1]+.5)*cell,y1:margin+(previous[0]+.5)*cell,x2:px,y2:py,
          stroke:`var(--viz-series-${player+1})`,'stroke-width':2}));
      }
      map.append(svgElement('circle',{cx:px,cy:py,r:cell*.18,fill:`var(--viz-series-${player+1})`}));
      section.append(map);pair.append(section);
    }
    get('stage').append(pair,element('div',{class:'viz-row text-small'},'● Player · ◇ Goal · × Added roadblock'));
  }
  function chessBoard(state){
    const wrap=element('div',{class:'sa-chess-wrap'}),width=Math.min(get('stage').clientWidth,420);
    const margin=22,cell=(width-margin)/8,height=width+6;
    const map=svg(width,height,`Recorded chess position. ${state.side_to_move} to move${state.in_check?', in check':''}. FEN: ${state.fen}`);
    const rows=state.fen.split(' ')[0].split('/');
    for(let row=0;row<8;row++)for(let col=0;col<8;col++){
      map.append(svgElement('rect',{x:margin+col*cell,y:row*cell,width:cell,height:cell,
        fill:(row+col)%2?'var(--muted)':'var(--background)',stroke:'var(--border)','stroke-width':.5}));
    }
    rows.forEach((rank,row)=>{
      let col=0;
      for(const item of rank){
        if(/\d/.test(item)){col+=Number(item);continue;}
        const white=item===item.toUpperCase(),x=margin+(col+.5)*cell,y=(row+.5)*cell;
        map.append(svgElement('circle',{cx:x,cy:y,r:cell*.35,
          fill:`color-mix(in srgb,var(--viz-series-${white?1:2}) 22%,transparent)`}));
        map.append(svgElement('text',{x,y:y+4,'text-anchor':'middle'},(white?'w':'b')+item.toUpperCase()));
        col++;
      }
    });
    for(let i=0;i<8;i++){
      map.append(svgElement('text',{x:12,y:(i+.5)*cell+4,'text-anchor':'middle'},8-i));
      map.append(svgElement('text',{x:margin+(i+.5)*cell,y:8*cell+17,'text-anchor':'middle'},'abcdefgh'[i]));
    }
    wrap.append(map);get('stage').append(wrap);
    get('stage').append(element('div',{class:'viz-row text-small'},
      `${state.side_to_move==='white'?'White':'Black'} to move${state.in_check?' · check':''} · w = White · b = Black · K king / Q queen / R rook / P pawn`));
  }
  function table(headers,rows){
    const result=element('table',{class:'table table-sm tabular-nums'}),head=element('thead'),headRow=element('tr');
    headers.forEach(text=>headRow.append(element('th',{scope:'col'},text)));head.append(headRow);
    const body=element('tbody');
    rows.forEach(values=>{const row=element('tr');values.forEach(text=>row.append(element('td',{},text)));body.append(row);});
    result.append(head,body);return result;
  }
  function market(state){
    const book=element('div',{class:'sa-market-book'}),levels={buy:new Map(),sell:new Map()};
    for(const order of state.orders){
      const old=levels[order.side].get(order.price)||{quantity:0,owners:new Set()};
      old.quantity+=order.quantity;old.owners.add(order.owner);levels[order.side].set(order.price,old);
    }
    const bids=[...levels.buy].sort((a,b)=>b[0]-a[0]),asks=[...levels.sell].sort((a,b)=>a[0]-b[0]);
    const ownerName=p=>p<2?`P${p}`:p===2?'Maker':'Noise';
    const fmt=pair=>pair?`${pair[0]} × ${pair[1].quantity} (${[...pair[1].owners].map(ownerName).join(', ')})`:'—';
    const rows=Array.from({length:Math.max(1,Math.min(4,Math.max(bids.length,asks.length)))},(_,i)=>[fmt(bids[i]),fmt(asks[i])]);
    book.append(table(['Bid: price × units','Ask: price × units'],rows));
    if(bids.length>4||asks.length>4)book.append(element('div',{class:'text-small'},'Best four price levels per side'));
    get('stage').append(book);
    const accounts=[0,1].map(player=>[`P${player}`,String(state.accounts[player].cash),
      String(state.accounts[player].inventory),String(state.signals[player])]);
    get('stage').append(element('div',{class:'sa-market-note text-small'},'Replay view · both private signals visible'));
    get('stage').append(table(['Trader','Cash','Units','Signal'],accounts));
    const last=state.last_trade;
    const trades=state.trades.map(t=>`${ownerName(t.buyer)} buys ${t.quantity} from ${ownerName(t.seller)} at ${t.price}`);
    get('stage').append(element('div',{class:'sa-market-trades text-small'},trades.length?trades.join(' · '):
      last?`No fills this step · last price ${last.price}`:'No trades yet'));
    if(state.done)get('stage').append(element('div',{class:'sa-market-note'},
      `Settlement ${state.settlement} · profit P0 ${state.pnl[0]>=0?'+':''}${state.pnl[0]} · P1 ${state.pnl[1]>=0?'+':''}${state.pnl[1]}`));
  }
  function actionText(action){
    if(action.move)return action.move;
    if(action.claim_draw)return 'claims draw';
    if(action.type==='move')return `moves ${action.direction}`;
    if(action.type==='block')return `blocks (${action.row}, ${action.col})`;
    if(action.type==='limit')return `${action.side} ${action.quantity} @ ${action.price}`;
    return action.type==='cancel'?'cancels orders':'holds';
  }
  function draw(){
    if(!data.episodes.length){
      get('stage').textContent='Awaiting recorded episodes';get('navigation').hidden=true;
      for(const name of ['game','checkpoint','episode'])get(name).disabled=true;
      return;
    }
    const episode=sync();
    selected.step=Math.min(selected.step,episode.actions.length);
    const state=episode.states[selected.step];
    get('players').replaceChildren(...episode.policies.map((name,p)=>identity(p,`P${p}: ${checkpointNames[name]||name}`)));
    get('stage').replaceChildren();
    if(episode.environment==='maze')maze(state,episode);
    else if(episode.environment==='chess')chessBoard(state);
    else market(state);
    get('counter').textContent=`${episode.environment==='chess'?'Ply':'Round'} ${selected.step} / ${episode.actions.length}`;
    get('prev').disabled=selected.step===0;get('next').disabled=selected.step===episode.actions.length;
    const previous=episode.actions[selected.step-1];
    let detail=previous?Object.entries(previous).map(([player,action])=>`P${player} ${actionText(action)}`).join(' · '):'Starting position';
    if(state.cancelled?.length)detail+=' · cancelled block: '+state.cancelled.map(p=>'P'+p).join(', ');
    get('detail').textContent=detail;
    const score=episode.returns.map((r,p)=>`P${p} ${r>0?'+':''}${r.toFixed(3)}`).join(' · ');
    get('result').textContent=state.done?`${episode.reason.replaceAll('_',' ')} · reward ${score}`:
      episode.environment==='maze'?`Replay distance to goal: P0 ${state.distances[0]} · P1 ${state.distances[1]}`:
      episode.environment==='chess'?`Material: White ${state.material[0]} · Black ${state.material[1]}`:'Settlement pending';
    root.dataset.episode=episode.id;root.dataset.step=selected.step;
  }
  restore(window.openai?.widgetState);
  get('game').addEventListener('change',()=>{selected.game=get('game').value;selected.episode=null;selected.step=0;draw();save();});
  get('checkpoint').addEventListener('change',()=>{selected.checkpoint=get('checkpoint').value;selected.episode=null;selected.step=0;draw();save();});
  get('episode').addEventListener('change',()=>{selected.episode=get('episode').value;selected.step=0;draw();save();});
  get('prev').addEventListener('click',()=>{selected.step--;draw();save();});
  get('next').addEventListener('click',()=>{selected.step++;draw();save();});
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);draw();}});
  new ResizeObserver(draw).observe(root);draw();
})();
</script>
